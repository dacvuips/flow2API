<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flow2API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }

    :root {
      color-scheme: light;
      --bg: #f4f6fa;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #e2e8f0;
      --text: #0f172a;
      --soft: #334155;
      --muted: #64748b;
      --green: #16a34a;
      --red: #dc2626;
      --blue: #2563eb;
      --amber: #d97706;
      --brand-blue: #1d8cff;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 340px;
      padding: 10px;
      background: linear-gradient(180deg, #f8fafc, var(--bg));
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { min-width: 0; }
    h1 { font-size: 18px; font-weight: 780; letter-spacing: -0.035em; line-height: 1.1; color: var(--text); }
    .logo-flow { color: #111827; }
    .logo-api { color: var(--brand-blue); font-weight: 850; margin-left: 2px; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .version { flex: 0 0 auto; padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--panel-soft); font-size: 11px; font-weight: 650; }

    .section { padding: 13px 16px; border-bottom: 1px solid var(--line); background: #ffffff; }
    .row { min-height: 30px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .row + .row { margin-top: 8px; }
    .label { color: var(--muted); font-weight: 650; }
    .value { min-width: 0; max-width: 178px; overflow: hidden; text-align: right; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); font-weight: 680; font-variant-numeric: tabular-nums; }

    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-weight: 750; }
    .status.offline { color: var(--muted); }
    .status.running { color: var(--blue); }
    .status.paused { color: var(--amber); }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: currentColor; }
    .token-ready { color: var(--green); }
    .token-missing { color: var(--red); }

    .metrics { padding: 13px 16px; background: var(--panel-soft); }
    .metric-row { min-height: 28px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
    .metric-row + .metric-row { margin-top: 6px; }
    .metric-label { color: var(--muted); font-weight: 650; }
    .metric-number { color: var(--text); font-weight: 760; font-variant-numeric: tabular-nums; }
    .metric-number.success { color: var(--green); }
    .metric-number.failed { color: var(--red); }

    .toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-track {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 0.2s ease;
      position: relative;
    }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.18);
      transition: transform 0.2s ease;
    }
    .toggle input:checked + .toggle-track {
      background: var(--brand-blue);
    }
    .toggle input:checked + .toggle-track .toggle-thumb {
      transform: translateX(18px);
    }
    .toggle input:focus-visible + .toggle-track {
      outline: 2px solid var(--brand-blue);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Flow2API Bridge">
    <header class="header">
      <div class="brand-row">
        <div class="brand">
          <h1><span class="logo-flow">Flow</span><span class="logo-api">2API</span></h1>
          <p class="subtitle">Google Flow To API</p>
        </div>
        <span class="version">v0.0.21</span>
      </div>
    </header>

    <section class="section" aria-label="Thông tin kết nối">
      <div class="row">
        <span class="label">Kết nối</span>
        <span class="status offline" id="status-pill" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">ngoại tuyến</span>
        </span>
      </div>
      <div class="row">
        <span class="label">Token</span>
        <span class="value token-missing" id="token-row">chưa có</span>
      </div>
      <div class="row">
        <span class="label">Profile ID</span>
        <span class="value" id="profile-row" title="">—</span>
      </div>
      <div class="row">
        <span class="label">Tài khoản</span>
        <span class="value" id="account-row">chưa nhận diện</span>
      </div>
      <div class="row">
        <span class="label">Máy chủ</span>
        <span class="value">127.0.0.1:1609</span>
      </div>
      <div class="row">
        <span class="label">Auto Create Flow</span>
        <label class="toggle" title="Tự click &quot;Create with Google Flow&quot; khi mở trang landing">
          <input type="checkbox" id="auto-click-create" checked />
          <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
        </label>
      </div>
      <div class="row">
        <span class="label">Auto click</span>
        <span class="value" id="auto-click-status">—</span>
      </div>
    </section>

    <section class="metrics" aria-label="Thống kê request">
      <div class="metric-row">
        <span class="metric-label">Request</span>
        <span class="metric-number" id="requests-num">0</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Thành công</span>
        <span class="metric-number success" id="success-num">0</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Thất bại</span>
        <span class="metric-number failed" id="failed-num">0</span>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
